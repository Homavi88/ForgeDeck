services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseforge
      POSTGRES_PASSWORD: pulseforge
      POSTGRES_DB: pulseforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulseforge:pulseforge@postgres:5432/pulseforge
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      STORAGE_DIR: /data/audio
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./storage/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulseforge:pulseforge@postgres:5432/pulseforge
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      STORAGE_DIR: /data/audio
    volumes:
      - ./storage/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
